    <meta property="og:title" content="Progress by course | COSYpractice">
    <meta property="og:description" content="Cross-course progress with CEFR level-up tracking, based on spaced-repetition mastery.">
    <meta property="og:url" content="https://cosylanguages.github.io/COSYpractice/progress-dashboard.html">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#FAF7F2">

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});

    <style>
        .pg-app { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
        .pg-back { color: var(--sage-ink, var(--cosy-ink-teal, #26695e)); text-decoration:none; font-weight:700; }
        .pg-app h1 { font-family:var(--font-serif,Georgia,serif); font-size:1.7rem; margin:8px 0 4px; }
        .pg-sub { color: var(--ink-muted,#5a5a50); margin:0 0 16px; font-size:.95rem; }
        .pg-streak { display:inline-flex; gap:6px; align-items:center; background:#fff3e0; border:1px solid #f0c674; color:#8a5a00; padding:6px 12px; border-radius:999px; font-weight:800; }
        .pg-toolbar { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
        .pg-course { margin: 24px 0; }
        .pg-course h2 { font-size:1.15rem; margin:0 0 8px; text-transform:capitalize; }
        .pg-level { background: var(--warm-white,#fffdf8); border:1px solid var(--border,rgba(74,107,80,.2)); border-radius:12px; padding:12px 14px; margin:8px 0; }
        .pg-level-row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
        .pg-level-name { font-weight:800; }
        .pg-bar { height:10px; background:#eee3d6; border-radius:6px; overflow:hidden; }
        .pg-bar > span { display:block; height:100%; background:linear-gradient(90deg,#3a8a5b,#5bb07e); transition:width .4s ease; }
        .pg-meta { font-size:.82rem; color: var(--ink-muted,#5a5a50); margin-top:6px; }
        .pg-badge { font-size:.72rem; font-weight:800; padding:3px 8px; border-radius:999px; }
        .pg-badge.ready { background:#e6f4ec; color:#1e5e36; }
        .pg-badge.progress { background:#fff3e0; color:#8a5a00; }
        .pg-badge.locked { background:#f0ece4; color:#5f5a50; }
        .pg-error { color:var(--coral-ink, #b5562f); font-weight:700; }
        .skip-link{position:absolute;left:-9999px;top:0;z-index:100}
        .skip-link:focus{left:8px;top:8px;background:var(--teal,#26695e);color:#fff;padding:8px 12px;border-radius:8px}
    html[data-theme="dark"] .pg-level{background:#1a241d}
        html[data-theme="dark"] .pg-bar{background:#2a3a2f}
        html[data-theme="dark"] .pg-streak{background:#3a3012;color:#f3dfa0;border-color:#8a6a1a}
        html[data-theme="dark"] .pg-badge.ready{background:#173a28;color:#9fe0b4}
        html[data-theme="dark"] .pg-badge.progress{background:#3a3012;color:#f3dfa0}
        html[data-theme="dark"] .pg-badge.locked{background:#26302a;color:#9fb0a3}
    </style>
  <link rel="stylesheet" href="https://cosylanguages.github.io/COSYlanguages/css/ecosystem-strip.css">
</head>
<body class="pm">
  <a href="#main" class="skip-link">Skip to Content</a>
<div data-ecosystem-strip data-self="practice"></div>
<nav id="cosy-nav" aria-label="COSY sites"></nav>
    <main class="pg-app" id="main" tabindex="-1">
        <a href="index.html" class="pg-back">← Back to Practice</a>
        <h1>📊 Cross-Course Progress</h1>
        <p class="pg-sub" id="pg-sub">Loading course progress…</p>

        <div class="pg-toolbar">
            <span class="pg-streak" id="pg-streak">🔥 0 day streak</span>
            <button type="button" class="btn btn-secondary" id="pg-reset">Reset progress</button>
        </div>

        <div id="pg-courses"></div>
        <p class="pg-error" id="pg-error" hidden></p>
    </main>
    <script src="_engine/progress.js"></script>
    <script>
    (function () {
        'use strict';
        var store = new window.COSYProgress();
        var coursesEl = document.getElementById('pg-courses');
        var subEl = document.getElementById('pg-sub');
        var errEl = document.getElementById('pg-error');
        var streakEl = document.getElementById('pg-streak');

        function fail(msg) { errEl.textContent = msg; errEl.hidden = false; subEl.textContent = 'Could not load curriculum stats'; }

        function renderStreak() {
            var s = store.getStreakInfo();
            streakEl.textContent = '🔥 ' + s.streakDays + ' day streak · ' + s.todayCount + ' today';
        }

        function render(data) {
            subEl.textContent = 'Level-up rule: ≥80% of a level\'s practice items reviewed AND average mastery ≥3 (mature).';
            coursesEl.innerHTML = '';
            var courses = (data && data.courses) ? data.courses : {};
            var grandReviewed = 0;
            Object.keys(courses).forEach(function (course) {
                var wrap = document.createElement('section'); wrap.className = 'pg-course';
                var h = document.createElement('h2'); h.textContent = course + ' course'; wrap.appendChild(h);
                courses[course].forEach(function (lv) {
                    var total = lv.total_items || lv.available_lessons || lv.authored_lessons || lv.lessons || 0;
                    var st = store.getLevelStatus(course, lv.level, total);
                    grandReviewed += st.reviewed;
                    var row = document.createElement('div'); row.className = 'pg-level';
                    var top = document.createElement('div'); top.className = 'pg-level-row';
                    var name = document.createElement('span'); name.className = 'pg-level-name';
                    name.textContent = lv.level;
                    var badge = document.createElement('span');
                    if (st.readyToLevelUp) { badge.className = 'pg-badge ready'; badge.textContent = '✓ Ready to level up'; }
                    else if (st.reviewed > 0) { badge.className = 'pg-badge progress'; badge.textContent = 'In progress'; }
                    else { badge.className = 'pg-badge locked'; badge.textContent = 'Not started'; }
                    top.appendChild(name); top.appendChild(badge);
                    var bar = document.createElement('div'); bar.className = 'pg-bar';
                    var fill = document.createElement('span'); fill.style.width = Math.min(100, st.reviewPct) + '%'; bar.appendChild(fill);
                    var meta = document.createElement('div'); meta.className = 'pg-meta';
                    var parts = [st.reviewed + ' / ' + st.total + ' practice items reviewed'];
                    if (lv.authored_lessons) parts.push(lv.authored_lessons + ' authored lessons');
                    if (lv.draft_lessons) parts.push(lv.draft_lessons + ' drafts');
                    if (lv.placeholder_lessons) parts.push(lv.placeholder_lessons + ' planned');
                    parts.push('mastery ' + st.masteryAvg + '/5');
                    parts.push(st.mature + ' mature');
                    meta.textContent = parts.join(' · ');
                    row.appendChild(top); row.appendChild(bar); row.appendChild(meta);
                    wrap.appendChild(row);
                });
                coursesEl.appendChild(wrap);
            });
            if (grandReviewed === 0) {
                subEl.textContent += ' No practice recorded yet — start a session and it will appear here.';
            }
            renderStreak();
        }

        function fetchJson(url) {
            return fetch(url).then(function (r) {
                if (!r.ok) throw new Error(url + ' not found');
                return r.json();
            });
        }

        function loadData() {
            return Promise.all([
                fetchJson('data/levels/curriculum-stats.json').catch(function () { return null; }),
                fetchJson('data/levels/cefr-outcomes.json').catch(function () { return null; })
            ]).then(function (res) {
                var stats = res[0], outcomes = res[1];
                var base = (stats && stats.courses) ? stats.courses
                    : (outcomes && outcomes.courses) ? outcomes.courses : null;
                if (!base) throw new Error('curriculum data not found');
                var itemTotals = {};
                if (outcomes && outcomes.courses) {
                    Object.keys(outcomes.courses).forEach(function (c) {
                        outcomes.courses[c].forEach(function (lv) {
                            var n = (lv.vocabulary_items || 0) + (lv.grammar_items || 0);
                            if (n) itemTotals[c + '|' + lv.level] = n;
                        });
                    });
                }
                var courses = {};
                Object.keys(base).forEach(function (c) {
                    courses[c] = base[c].map(function (lv) {
                        var copy = {};
                        for (var k in lv) copy[k] = lv[k];
                        copy.total_items = itemTotals[c + '|' + lv.level]
                            || lv.available_lessons || lv.lessons || 0;
                        return copy;
                    });
                });
                return { courses: courses };
            });
        }

        function load() {
            loadData().then(render).catch(function (e) { fail(e.message); });
        }

        document.getElementById('pg-reset').addEventListener('click', function () {
            if (!confirm('Reset all saved progress? This cannot be undone.')) return;
            store.reset(); load();
        });

        load();
    })();
    </script>
<footer id="cosy-footer"></footer>
<script src="js/shell.js"></script>
