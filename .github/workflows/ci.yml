name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check external references
        run: node scripts/check-external-refs.js

      - name: Validate the daily speaking and writing prompts
        run: node scripts/validate-daily-prompts.js

      - name: Check CEFR outcome counts
        run: node scripts/check-cefr-outcomes.js

      - name: Test the DELF/DALF theme coverage
        run: node scripts/test-exam-themes.js

      - name: Test the daily challenge source
        run: node scripts/test-daily-source.js

      - name: Test speaking and writing coverage
        run: |
          node scripts/test-speaking-coverage.js
          node scripts/test-writing-coverage.js

      - name: Test the theme normaliser
        run: node scripts/test-theme-aliases.js

      - name: Test vocabulary confusion-pair matching
        run: node scripts/test-vocab-pairs.js

      - name: Test confusion-pair data loading
        run: node scripts/test-pair-loader.js

      - name: Check local asset references
        run: node scripts/check-local-refs.js

      - name: Check out the canonical COSYdata taxonomy
        uses: actions/checkout@v4
        with:
          repository: cosylanguages/COSYdata
          path: .cosy/COSYdata

      - name: Check shared theme schema
        env:
          COSYDATA_DIR: ${{ github.workspace }}/.cosy/COSYdata
        run: node scripts/check-shared-themes.js

      - name: Audit practice theme coverage against COSYdata
        env:
          COSYDATA_DIR: ${{ github.workspace }}/.cosy/COSYdata
        run: node scripts/audit-theme-coverage.js

      - name: Check grammar confusion-pair coverage
        env:
          COSYDATA_DIR: ${{ github.workspace }}/.cosy/COSYdata
        run: node scripts/check-grammar-coverage.js

      - name: Check out the canonical COSYmanuals pages
        uses: actions/checkout@v4
        with:
          repository: cosylanguages/COSYmanuals
          path: .cosy/COSYmanuals

      - name: Check practice manual links
        env:
          COSYMANUALS_DIR: ${{ github.workspace }}/.cosy/COSYmanuals
        run: node scripts/check-practice-links.js

      - name: Check out the shared COSYlanguages registry
        uses: actions/checkout@v4
        with:
          repository: cosylanguages/COSYlanguages
          path: .cosy/COSYlanguages

      - name: Check shared language registry
        env:
          COSYLANGUAGES_DIR: ${{ github.workspace }}/.cosy/COSYlanguages
        run: node scripts/check-shared-languages.js

      - name: Check out the canonical COSYplatform curriculum
        uses: actions/checkout@v4
        with:
          repository: cosylanguages/COSYplatform
          path: .cosy/COSYplatform

      - name: Check curriculum stats
        env:
          COSYPLATFORM_DIR: ${{ github.workspace }}/.cosy/COSYplatform
        run: node scripts/check-curriculum-stats.js

      - name: Check authored lesson can-do coverage
        env:
          COSYPLATFORM_DIR: ${{ github.workspace }}/.cosy/COSYplatform
        run: node scripts/audit-cando-coverage.js
